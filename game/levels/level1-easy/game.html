<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <link rel="stylesheet" href="main.css">
    <script src="game.js" defer> </script>
</head>

<body>
    <div class="gameContainer">
        <h1> Game - V. 1</h1>
        <div class="gameBox" id="gameBox">
            <div id="gameGrid">
                <!-- HERE IS THE MAIN GAME! -->
                <div class="block playerBox" id="playerBox">

                </div>
                <div class="block crate" id="crate">

                </div>
                <div class="block boxWinBlock" id="boxWinBlock">

                </div>
                <div class="block playerWinBlock" id="playerWinBlock">

                </div>
            </div>
        </div>
        <div class="instructionBox">
            <h1> INSTRUCTIONS: </h1>
            <ul>
                <li>
                    W - Move up
                </li>
                <li>
                    S - Move down
                </li>
                <li>
                    A - Move left
                </li>
                <li>
                    D - Move right
                </li>
            </ul>
            <p>
                <span class="shush"> don't enter the black box, for your own sake </span>
            </p>
        </div>
    </div>
</body>

</html>
